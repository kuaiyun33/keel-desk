[package]
name = "deepseek-harness-desktop"
version = "1.0.4"
description = "A lightweight, cross-platform Tauri desktop shell for DeepSeek Harness"
authors = ["WJZ_P"]
edition = "2024"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dunce = "1"
# The usage widget reads the account balance over HTTPS and totals today's
# token spend out of the zstd-compressed session logs.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
zstd = "0.13"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
